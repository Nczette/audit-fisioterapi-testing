<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Audit Fisioterapi — KKM</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>
<style>
:root{--bg:#f4f2ed;--sur:#fff;--sur2:#f0ede6;--bor:#d8d4cc;--bor2:#c8c4bc;--tx:#1a1916;--tx2:#5a5750;--tx3:#9a9590;--acc:#1a3a5c;--acc2:#2d5f8a;--gn:#2a5c3f;--am:#7a4a0a;--rd:#7a1a1a;--bl:#1a3a5c;--r1b:#fde8e8;--r1t:#7a1a1a;--r1o:#e8a0a0;--r2b:#fef3e0;--r2t:#7a4a0a;--r2o:#f0c060;--r3b:#e8f4ec;--r3t:#2a5c3f;--r3o:#80c090;--r4b:#e8eef6;--r4t:#1a3a5c;--r4o:#80a8d0;--fn:'IBM Plex Sans',sans-serif;--mo:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
.hdr{background:var(--acc);color:#fff}
.hdr-in{max-width:1200px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:14px}
.hdr-logo{width:38px;height:38px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mo);font-size:15px;color:#fff;flex-shrink:0}
.hdr-t h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em}
.hdr-t p{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.hdr-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:3px 9px;font-size:10px;color:rgba(255,255,255,.7);font-family:var(--mo);white-space:nowrap;margin-left:auto}
.nav-w{background:var(--sur);border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:100}
.nav{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;overflow-x:auto}
.nb{padding:11px 15px;border:none;background:transparent;color:var(--tx2);font-family:var(--fn);font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;letter-spacing:.03em;text-transform:uppercase}
.nb:hover{color:var(--tx);background:var(--sur2)}
.nb.on{color:var(--acc);border-bottom-color:var(--acc)}
.main{max-width:1200px;margin:0 auto;padding:22px}
.pg{display:none}.pg.on{display:block}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:8px;overflow:hidden;margin-bottom:14px}
.ch{padding:11px 17px;background:var(--sur2);border-bottom:1px solid var(--bor);display:flex;justify-content:space-between;align-items:center}
.ct{font-size:11px;font-weight:600;color:var(--tx);text-transform:uppercase;letter-spacing:.05em}
.cs{font-family:var(--mo);font-size:11px;color:var(--tx2)}
.istrip{background:#e8eef6;border:1px solid var(--r4o);border-radius:8px;padding:9px 15px;margin-bottom:14px;font-size:12px;color:var(--bl);line-height:1.7}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin-bottom:14px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.ff label{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.ff input,.ff select,.ff textarea{width:100%;padding:6px 9px;border:1px solid var(--bor);border-radius:5px;background:var(--sur);color:var(--tx);font-size:12px;font-family:var(--fn);outline:none}
.ff input:focus,.ff textarea:focus{border-color:var(--acc2)}
.ff textarea{resize:vertical;min-height:54px}
.ir{padding:9px 17px;border-bottom:1px solid var(--bor);transition:background .1s}
.ir:last-child{border-bottom:none}
.ir:hover{background:var(--sur2)}
.il{font-size:12px;color:var(--tx);line-height:1.45;margin-bottom:5px}
.ic{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap}
.rg{display:flex;gap:3px}
.rb{padding:4px 9px;border:1px solid var(--bor2);border-radius:4px;background:transparent;color:var(--tx2);font-size:11px;font-family:var(--mo);font-weight:500;cursor:pointer;transition:all .12s}
.rb:hover{border-color:var(--acc2);color:var(--acc)}
.rb.r1.on{background:var(--r1b);color:var(--r1t);border-color:var(--r1o)}
.rb.r2.on{background:var(--r2b);color:var(--r2t);border-color:var(--r2o)}
.rb.r3.on{background:var(--r3b);color:var(--r3t);border-color:var(--r3o)}
.rb.r4.on{background:var(--r4b);color:var(--r4t);border-color:var(--r4o)}
.rb.rna.on{background:var(--sur2);color:var(--tx2);border-color:var(--bor2)}
.rb.d0.on{background:var(--r1b);color:var(--r1t);border-color:var(--r1o)}
.rb.d1.on{background:var(--r2b);color:var(--r2t);border-color:var(--r2o)}
.rb.d2.on{background:var(--r3b);color:var(--r3t);border-color:var(--r3o)}
.rb.p1.on{background:var(--r1b);color:var(--r1t);border-color:var(--r1o)}
.rb.p2.on{background:var(--r2b);color:var(--r2t);border-color:var(--r2o)}
.rb.p3.on{background:var(--r3b);color:var(--r3t);border-color:var(--r3o)}
.ita{flex:1;min-width:160px;padding:4px 7px;border:1px solid var(--bor);border-radius:4px;background:var(--sur);color:var(--tx);font-size:11px;font-family:var(--fn);resize:none;min-height:36px;outline:none}
.ita:focus{border-color:var(--acc2)}
.brow{display:flex;gap:8px;justify-content:flex-end;padding:6px 0 14px}
.bp{padding:8px 20px;background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:5px;font-size:12px;font-weight:600;font-family:var(--fn);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.bp:hover{background:var(--acc2)}
.bs{padding:8px 20px;background:transparent;color:var(--tx2);border:1px solid var(--bor2);border-radius:5px;font-size:12px;font-family:var(--fn);cursor:pointer}
.bs:hover{border-color:var(--acc2);color:var(--acc)}
.stabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.stb{padding:5px 13px;border:1px solid var(--bor);border-radius:5px;background:transparent;color:var(--tx2);font-size:11px;font-family:var(--fn);font-weight:500;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;transition:all .15s}
.stb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px}
.met{background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:12px 15px}
.ml{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:5px}
.mv{font-size:24px;font-weight:600;font-family:var(--mo);color:var(--tx);line-height:1}
.ms{font-size:10px;color:var(--tx3);margin-top:3px}
.pr{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.pn{font-size:11px;color:var(--tx2);width:185px;flex-shrink:0;line-height:1.3}
.pt{flex:1;height:6px;background:var(--sur2);border-radius:3px;overflow:hidden;border:1px solid var(--bor)}
.pf{height:100%;border-radius:3px;transition:width .5s}
.pp{font-family:var(--mo);font-size:11px;color:var(--tx);width:32px;text-align:right}
.wi1{padding:7px 11px;border-left:3px solid var(--r1o);background:var(--r1b);border-radius:0 5px 5px 0;margin-bottom:4px}
.wi2{padding:7px 11px;border-left:3px solid var(--r2o);background:var(--r2b);border-radius:0 5px 5px 0;margin-bottom:4px}
.wl{font-size:11px;color:var(--tx)}
.wm{font-size:10px;color:var(--tx3);margin-top:1px}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-family:var(--mo);font-weight:500;margin-left:5px}
.b1{background:var(--r1b);color:var(--r1t);border:1px solid var(--r1o)}
.b2{background:var(--r2b);color:var(--r2t);border:1px solid var(--r2o)}
.b3{background:var(--r3b);color:var(--r3t);border:1px solid var(--r3o)}
.b4{background:var(--r4b);color:var(--r4t);border:1px solid var(--r4o)}
.rtag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-family:var(--mo);font-weight:500}
.rc{background:var(--r4b);color:var(--r4t);border:1px solid var(--r4o)}
.rb_{background:var(--r3b);color:var(--r3t);border:1px solid var(--r3o)}
.rs{background:var(--r2b);color:var(--r2t);border:1px solid var(--r2o)}
.rl{background:var(--r1b);color:var(--r1t);border:1px solid var(--r1o)}
.htbl{width:100%;border-collapse:collapse}
.htbl th{padding:7px 13px;background:var(--sur2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);text-align:left;border-bottom:1px solid var(--bor)}
.htbl td{padding:8px 13px;font-size:12px;border-bottom:1px solid var(--bor);color:var(--tx)}
.htbl tr:last-child td{border-bottom:none}
.htbl tr:hover td{background:var(--sur2)}
.pd-r{padding:9px 17px;border-bottom:1px solid var(--bor)}
.pd-r:last-child{border-bottom:none}
.pd-i{font-size:12px;font-weight:600;color:var(--tx)}
.pd-d{font-size:11px;color:var(--tx2);margin-top:2px;line-height:1.55}
.sdiv{border-left:3px solid var(--acc);padding-left:9px;margin:13px 17px 5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--acc)}
.es{text-align:center;padding:28px;color:var(--tx3);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
/* Fas detail */
.fd{background:var(--sur2);border:1px solid var(--bor);border-radius:6px;padding:11px 15px;margin-top:4px;margin-bottom:12px}
.fd-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-bottom:11px}
.fd-lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.fd-val{font-size:12px;font-weight:500}
.dist-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.dtag{font-size:10px;padding:2px 7px;border-radius:3px;font-family:var(--mo)}
.item-tbl{width:100%;border-collapse:collapse;font-size:11px}
.item-tbl th{padding:4px 7px;background:var(--sur2);border:1px solid var(--bor);font-size:10px;text-align:left}
.item-tbl td{padding:4px 7px;border:1px solid var(--bor)}
.fas-row{cursor:pointer;margin-bottom:3px}
.fas-header{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding:8px 11px;background:var(--sur);border:1px solid var(--bor);border-radius:6px}
details summary{cursor:pointer;font-size:11px;font-weight:600;color:var(--acc);padding:6px 0}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <div class="hdr-logo">Fy</div>
    <div class="hdr-t"><h1>Sistem Audit Perkhidmatan Fisioterapi</h1><p>Bahagian Sains Kesihatan Bersekutu — Kementerian Kesihatan Malaysia</p></div>
    <div class="hdr-badge">JKTFS 2026</div>
  </div>
</div>
<div class="nav-w">
  <div class="nav">
    <button class="nb on" onclick="sp('b1')">Borang Perkhidmatan</button>
    <button class="nb" onclick="sp('b2')">Audit Dokumentasi</button>
    <button class="nb" onclick="sp('b3')">Audit Personel</button>
    <button class="nb" onclick="sp('dash')">Dashboard</button>
    <button class="nb" onclick="sp('pan')">Panduan</button>
    <button class="nb" onclick="sp('hist')">Sejarah Audit</button>
  </div>
</div>
<div class="main">

<!-- BORANG 1 -->
<div id="pg-b1" class="pg on">
  <div class="istrip"><b>Borang Audit Perkhidmatan Profesion Fisioterapi</b> — Bahagian Sains Kesihatan Bersekutu, KKM &nbsp;|&nbsp; <b>1</b> Rendah &nbsp; <b>2</b> Sederhana &nbsp; <b>3</b> Baik &nbsp; <b>4</b> Cemerlang &nbsp; <b>N/A</b></div>
  <div class="fg4">
    <div class="ff"><label>Nama Fasiliti / Hospital</label><input id="b1-f" type="text" placeholder="Hospital / Klinik"></div>
    <div class="ff"><label>Tarikh Audit</label><input id="b1-d" type="date"></div>
    <div class="ff"><label>Nama Auditor</label><input id="b1-au" type="text"></div>
    <div class="ff"><label>Nama Auditee</label><input id="b1-ae" type="text"></div>
  </div>
  <div id="b1-body"></div>
  <div class="card"><div class="ch"><span class="ct">Ruangan Tambahan</span></div>
    <div style="padding:13px 17px"><div class="two">
      <div class="ff"><label>Lain-lain Penemuan</label><textarea id="b1-la"></textarea></div>
      <div class="ff"><label>Kesimpulan</label><textarea id="b1-ke"></textarea></div>
      <div class="ff"><label>Catatan</label><textarea id="b1-ca"></textarea></div>
      <div class="ff"><label>Cadangan</label><textarea id="b1-cd"></textarea></div>
    </div></div>
  </div>
  <div class="brow"><button class="bs" onclick="rb(1)">Set Semula</button><button class="bp" onclick="sv(1)">Simpan &amp; Lihat Dashboard</button></div>
</div>

<!-- BORANG 2 -->
<div id="pg-b2" class="pg">
  <div class="istrip"><b>Physiotherapy Clinical Documentation Audit Form</b> — Allied Health Sciences Division, MOH &nbsp;|&nbsp; <b>0</b> Not Filled &nbsp; <b>1</b> Incomplete &nbsp; <b>2</b> Complete &nbsp; <b>N/A</b></div>
  <div class="fg4">
    <div class="ff"><label>Fasiliti</label><input id="b2-f" type="text" placeholder="Hospital / Klinik"></div>
    <div class="ff"><label>Tarikh</label><input id="b2-d" type="date"></div>
    <div class="ff"><label>Nama Evaluator</label><input id="b2-ev" type="text"></div>
    <div class="ff"><label>Jawatan</label><input id="b2-jw" type="text"></div>
  </div>
  <div id="b2-body"></div>
  <div class="card"><div class="ch"><span class="ct">Other Comments</span></div>
    <div style="padding:13px 17px"><div class="ff"><textarea id="b2-ko" placeholder="Additional comments..." style="min-height:64px"></textarea></div></div>
  </div>
  <div class="brow"><button class="bs" onclick="rb(2)">Reset</button><button class="bp" onclick="sv(2)">Save &amp; View Dashboard</button></div>
</div>

<!-- BORANG 3 -->
<div id="pg-b3" class="pg">
  <div class="istrip"><b>Borang Audit Personel Profesion Fisioterapi</b> — Bahagian Sains Kesihatan Bersekutu, KKM &nbsp;|&nbsp; <b>1</b> Kurang Memuaskan &nbsp; <b>2</b> Memuaskan &nbsp; <b>3</b> Baik</div>
  <div class="fg4">
    <div class="ff"><label>Tarikh</label><input id="b3-d" type="date"></div>
    <div class="ff"><label>Nama Staf (PYD)</label><input id="b3-pyd" type="text" placeholder="Nama penuh staf"></div>
    <div class="ff"><label>Nama Penyelia</label><input id="b3-pen" type="text"></div>
    <div class="ff"><label>Unit / Fasiliti</label><input id="b3-f" type="text"></div>
  </div>
  <div id="b3-body"></div>
  <div class="card"><div class="ch"><span class="ct">Ulasan Keseluruhan</span></div>
    <div style="padding:13px 17px"><div class="ff"><textarea id="b3-ul" placeholder="Ulasan penyelia..." style="min-height:64px"></textarea></div></div>
  </div>
  <div class="brow"><button class="bs" onclick="rb(3)">Set Semula</button><button class="bp" onclick="sv(3)">Simpan</button></div>
</div>

<!-- DASHBOARD -->
<div id="pg-dash" class="pg">
  <div class="stabs">
    <button class="stb on" onclick="sdash('d1',this)">Perkhidmatan</button>
    <button class="stb" onclick="sdash('d2',this)">Dokumentasi</button>
    <button class="stb" onclick="sdash('d3',this)">Personel</button>
  </div>
  <div id="dash-d1"></div>
  <div id="dash-d2" style="display:none"></div>
  <div id="dash-d3" style="display:none"></div>
</div>

<!-- PANDUAN -->
<div id="pg-pan" class="pg">
  <div class="stabs">
    <button class="stb on" onclick="span2('p1',this)">Panduan Perkhidmatan</button>
    <button class="stb" onclick="span2('p2',this)">Panduan Dokumentasi</button>
  </div>
  <div id="pan-p1"></div>
  <div id="pan-p2" style="display:none"></div>
</div>

<!-- SEJARAH -->
<div id="pg-hist" class="pg">
  <div class="stabs">
    <button class="stb on" onclick="shist('h1',this)">Perkhidmatan</button>
    <button class="stb" onclick="shist('h2',this)">Dokumentasi</button>
    <button class="stb" onclick="shist('h3',this)">Personel</button>
  </div>
  <div id="hist-h1"></div>
  <div id="hist-h2" style="display:none"></div>
  <div id="hist-h3" style="display:none"></div>
</div>

</div>

  S1.forEach(function(sec){var t=0,m=0;sec.items.forEach(function(it){var r=R1[it.id];if(r&&r!=='NA'){t+=r;m+=4;dist[r]=(dist[r]||0)+1;if(r<=2)wk.push({l:it.l,r:r,s:sec.t.replace(/^\d+\s*[\u2014-]\s*/,'')});}else if(r===undefined){m+=4;}});tot+=t;mxt+=m;sD.push({t:sec.t.replace(/^\d+\s*[\u2014-]\s*/,''),v:t,m:m,pct:m>0?Math.round(t/m*100):0});});
  var pct=mxt>0?Math.round(tot/mxt*100):0;
  return {tot:tot,mxt:mxt,pct:pct,rat:rS(pct)+' '+rL(pct),sD:sD,wk:wk,dist:dist};
}
function cl2(){
  var tot=0,mxt=0,wk=[];
  S2.forEach(function(sec){sec.items.forEach(function(it){var r=R2[it.id];if(r!==undefined&&r!=='NA'){tot+=r;mxt+=2;if(r<=1)wk.push({l:it.l,r:r});}else if(r===undefined){mxt+=2;}});});
  var pct=mxt>0?Math.round(tot/mxt*100):0;
  return {tot:tot,mxt:mxt,pct:pct,rat:rS(pct)+' '+(pct>=80?'Excellent':pct>=60?'Good':pct>=40?'Fair':'Poor'),wk:wk};
}
function cl3(){
  var tot=0,mxt=0,sD=[],wk=[];
  S3.forEach(function(sec){var t=0,m=0;sec.items.forEach(function(it){var r=R3[it.id];if(r){t+=r;m+=3;if(r===1)wk.push({l:it.l,r:r,s:sec.t.replace(/^Bahagian\s*\d+\s*[\u2014-]\s*/i,'')});}else{m+=3;}});tot+=t;mxt+=m;sD.push({t:sec.t.replace(/^Bahagian\s*\d+\s*[\u2014-]\s*/i,''),v:t,m:m,pct:m>0?Math.round(t/m*100):0});});
  var pct=mxt>0?Math.round(tot/mxt*100):0;
  return {tot:tot,mxt:mxt,pct:pct,rat:rS(pct)+' '+rL(pct),sD:sD,wk:wk};
}
function sv(n){
  var td=new Date().toISOString().slice(0,10);
  if(n===1){
    var r=cl1();var items={};
    S1.forEach(function(sec){sec.items.forEach(function(it){items[it.id]={l:it.l,s:sec.t.replace(/^\d+\s*[\u2014-]\s*/,''),r:R1[it.id],k:R1[it.id+'_k']||'',p:R1[it.id+'_p']||''};});});
    H1.push({fas:document.getElementById('b1-f').value||'N/A',trk:document.getElementById('b1-d').value||td,aud:document.getElementById('b1-au').value||'—',aue:document.getElementById('b1-ae').value||'—',tot:r.tot,max:r.mxt,pct:r.pct,rat:r.rat,sD:r.sD,wk:r.wk,dist:r.dist,items:items,la:document.getElementById('b1-la').value,ke:document.getElementById('b1-ke').value,ca:document.getElementById('b1-ca').value,cd:document.getElementById('b1-cd').value});

    H2.push({fas:document.getElementById('b2-f').value||'N/A',trk:document.getElementById('b2-d').value||td,ev:document.getElementById('b2-ev').value||'—',jw:document.getElementById('b2-jw').value||'—',tot:r.tot,max:r.mxt,pct:r.pct,rat:r.rat,wk:r.wk,items:items,ko:document.getElementById('b2-ko').value});
    try{localStorage.setItem('ah2',JSON.stringify(H2));}catch(e){}
    sp('dash');sdash('d2',null);
  }
  if(n===3){
    var r=cl3();var items={};
    S3.forEach(function(sec){sec.items.forEach(function(it){items[it.id]={l:it.l,s:sec.t.replace(/^Bahagian\s*\d+\s*[\u2014-]\s*/i,''),r:R3[it.id],c:R3[it.id+'_c']||''};});});
    H3.push({pyd:document.getElementById('b3-pyd').value||'N/A',pen:document.getElementById('b3-pen').value||'N/A',fas:document.getElementById('b3-f').value||'N/A',trk:document.getElementById('b3-d').value||td,tot:r.tot,max:r.mxt,pct:r.pct,rat:r.rat,sD:r.sD,wk:r.wk,items:items,ul:document.getElementById('b3-ul').value});
    try{localStorage.setItem('ah3',JSON.stringify(H3));}catch(e){}
    sp('dash');sdash('d3',null);
  }
}
function rb(n){
  if(n===1){R1={};document.querySelectorAll('#b1-body .rb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('#b1-body .ita').forEach(function(t){t.value='';});usc1();}
  if(n===2){R2={};document.querySelectorAll('#b2-body .rb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('#b2-body .ita').forEach(function(t){t.value='';});usc2();}
  if(n===3){R3={};document.querySelectorAll('#b3-body .rb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('#b3-body .ita').forEach(function(t){t.value='';});usc3();}
}
function dch(){ACH.forEach(function(c){try{c.destroy();}catch(e){}});ACH=[];}
function fdk(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}
function toggleFD(id){var el=document.getElementById(id);if(!el)return;var show=el.style.display==='none';el.style.display=show?'block':'none';var arr=el.previousElementSibling&&el.previousElementSibling.querySelector('.arr');if(arr)arr.textContent=show?'\u25b2':'\u25bc';}
function fasBar(a,did,nf){
  var nm=a[nf]||a.fas||'—';
  var bc=a.pct>=80?'#2a5c3f':a.pct>=60?'#2d5f8a':a.pct>=40?'#c87820':'#a02020';
  return '<div style="cursor:pointer" onclick="toggleFD(\''+did+'\')"><div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sur);border:1px solid var(--bor);border-radius:6px;margin-bottom:4px"><span style="flex:1;font-size:13px;font-weight:600">'+nm+'</span><div style="flex:2;height:7px;background:var(--sur2);border-radius:3px;overflow:hidden;border:1px solid var(--bor)"><div style="height:100%;border-radius:3px;width:'+a.pct+'%;background:'+bc+'"></div></div><span style="font-family:var(--mo);font-size:12px;font-weight:500;width:36px;text-align:right">'+a.pct+'%</span><span class="rtag '+rC(a.pct)+'">'+rL(a.pct)+'</span><span class="arr" style="font-size:10px;color:var(--tx3)">\u25bc</span></div></div>';
}
function fdInfo(rows){return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-bottom:10px">'+rows.map(function(r){return '<div><div class="fd-lbl">'+r[0]+'</div><div class="fd-val">'+r[1]+'</div></div>';}).join('')+'</div>';}
function fdSec(sD){if(!sD||!sD.length)return '';return '<div style="margin-bottom:10px">'+sD.map(function(s,i){return '<div class="pr"><span class="pn" style="font-size:11px">'+s.t+'</span><div class="pt"><div class="pf" style="width:'+s.pct+'%;background:'+BC[i%BC.length]+'"></div></div><span class="pp">'+s.pct+'%</span></div>';}).join('')+'</div>';}
function fdDist(dist){if(!dist)return '';return '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px"><span class="bdg b1">Markah 1: '+(dist[1]||0)+'</span><span class="bdg b2">Markah 2: '+(dist[2]||0)+'</span><span class="bdg b3">Markah 3: '+(dist[3]||0)+'</span><span class="bdg b4">Markah 4: '+(dist[4]||0)+'</span></div>';}
function fdWeak(wk,lbl){
  if(!wk||!wk.length)return '';
  var h='<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:5px">Item Memerlukan Perhatian</div>';
  wk.forEach(function(w){h+='<div class="'+(w.r<=1?'wi1':'wi2')+'"><div class="wl">'+w.l+'<span class="bdg '+(w.r<=1?'b1':'b2')+'">'+lbl+' '+w.r+'</span></div><div class="wm">'+(w.s||'')+'</div></div>';});
  return h;
}
function fdItems(items,cols){
  if(!items)return '';
  var h='<details><summary>Lihat semua item &#9658;</summary><table class="itbl"><thead><tr>'+cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
  Object.values(items).forEach(function(it){
    var rv=it.r;var nr=rv!==undefined&&rv!==null&&rv!=='NA';
    var isL=nr&&rv<=1,isM=nr&&rv===2,isH=nr&&rv>=3;
    var bg=isL?'var(--r1b)':isM?'var(--r2b)':isH?'var(--r3b)':'';
    var tc=isL?'var(--r1t)':isM?'var(--r2t)':isH?'var(--r3t)':'var(--tx3)';
    var ex=cols.length===4?'<td>'+( it.k||'—')+'</td><td>'+(it.p||'—')+'</td>':it.rem!==undefined?'<td>'+(it.rem||'—')+'</td>':'<td>'+(it.c||'—')+'</td>';
    h+='<tr><td>'+it.l+'</td><td style="text-align:center;background:'+bg+';color:'+tc+';font-family:var(--mo);font-weight:600">'+(rv!==undefined&&rv!==null?rv:'—')+'</td>'+ex+'</tr>';
  });
  h+='</tbody></table></details>';return h;
}
function rdD1(){
  dch();var el=document.getElementById('dash-d1');
  if(!H1.length){el.innerHTML='<div class="card"><div class="es">Tiada rekod audit perkhidmatan lagi. Isi borang dan simpan.</div></div>';return;}
  var latest={};H1.forEach(function(a){if(!latest[a.fas]||a.trk>latest[a.fas].trk)latest[a.fas]=a;});
  var arr=Object.values(latest).sort(function(a,b){return b.pct-a.pct;});
  var h='<div class="card"><div class="ch"><span class="ct">Ringkasan Semua Fasiliti</span><span class="cs">'+arr.length+' fasiliti</span></div><div style="padding:12px 16px">';
  arr.forEach(function(a){
    var did='fd1_'+fdk(a.fas);
    var det='<div id="'+did+'" class="fd" style="display:none">';
    det+=fdInfo([['Tarikh Audit',a.trk],['Auditor',a.aud],['Auditee',a.aue||'—'],['Markah',a.tot+'/'+a.max+' ('+a.pct+'%)']]);
    det+=fdSec(a.sD)+fdDist(a.dist)+fdWeak(a.wk,'Markah');
    det+=fdItems(a.items,['Item','Markah','Komen Auditor','Penambahbaikan']);
    if(a.la||a.ke||a.ca||a.cd){det+='<div style="margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px">';if(a.la)det+='<div><div class="fd-lbl">Lain-lain Penemuan</div><div style="font-size:11px">'+a.la+'</div></div>';if(a.ke)det+='<div><div class="fd-lbl">Kesimpulan</div><div style="font-size:11px">'+a.ke+'</div></div>';if(a.ca)det+='<div><div class="fd-lbl">Catatan</div><div style="font-size:11px">'+a.ca+'</div></div>';if(a.cd)det+='<div><div class="fd-lbl">Cadangan</div><div style="font-size:11px">'+a.cd+'</div></div>';det+='</div>';}
    var prev=H1.filter(function(x){return x.fas===a.fas;}).sort(function(x,y){return y.trk.localeCompare(x.trk);});
    if(prev.length>1){det+='<div style="margin-top:9px"><div style="font-size:10px;font-weight:600;text-transform:uppercase;color:var(--tx3);margin-bottom:5px">Sejarah Audit Fasiliti Ini</div><table class="htbl"><thead><tr><th>Tarikh</th><th>Auditor</th><th>Markah</th><th>Rating</th></tr></thead><tbody>';prev.forEach(function(x){det+='<tr><td>'+x.trk+'</td><td>'+x.aud+'</td><td style="font-family:var(--mo)">'+x.pct+'%</td><td><span class="rtag '+rC(x.pct)+'">'+x.pct+'%</span></td></tr>';});det+='</tbody></table></div>';}
    det+='</div>';
    h+=fasBar(a,did,'fas')+det;
  });
  h+='</div></div>';
  if(arr.length>1){h+='<div class="card"><div class="ch"><span class="ct">Carta Perbandingan Fasiliti</span></div><div style="position:relative;padding:12px;height:'+(Math.max(200,arr.length*50+80))+'px"><canvas id="cmp1"></canvas></div></div>';}
  var mf=H1.filter(function(a){return H1.filter(function(x){return x.fas===a.fas;}).length>1;});
  if(mf.length){h+='<div class="card"><div class="ch"><span class="ct">Trend Markah Mengikut Fasiliti</span></div><div style="position:relative;padding:12px;height:240px"><canvas id="trnd1"></canvas></div></div>';}
  el.innerHTML=h;
  if(arr.length>1){
    var ch=new Chart(document.getElementById('cmp1'),{type:'bar',data:{labels:arr.map(function(a){return a.fas.length>18?a.fas.substring(0,16)+'...':a.fas;}),datasets:[{data:arr.map(function(a){return a.pct;}),backgroundColor:arr.map(function(a){return a.pct>=80?'#80c090':a.pct>=60?'#80a8d0':a.pct>=40?'#f0c060':'#e8a0a0';}),borderWidth:1}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{min:0,max:100,ticks:{callback:function(v){return v+'%';}}}}}});
    ACH.push(ch);
  }
  if(mf.length){
    var fasL=[...new Set(mf.map(function(a){return a.fas;}))];
    var cols2=['#2d5f8a','#2a5c3f','#c87820','#a02020','#6a5a8a'];
    var ds=fasL.map(function(f,i){var pts=H1.filter(function(a){return a.fas===f;}).sort(function(a,b){return a.trk.localeCompare(b.trk);});return{label:f,data:pts.map(function(p){return{x:p.trk,y:p.pct};}),borderColor:cols2[i%5],backgroundColor:'transparent',tension:0.3,pointRadius:4};});
    var tc=new Chart(document.getElementById('trnd1'),{type:'line',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},scales:{x:{type:'category'},y:{min:0,max:100,ticks:{callback:function(v){return v+'%';}}}}}});
    ACH.push(tc);
  }
}
function rdD2(){
  dch();var el=document.getElementById('dash-d2');
  if(!H2.length){el.innerHTML='<div class="card"><div class="es">Tiada rekod audit dokumentasi lagi.</div></div>';return;}
  var latest={};H2.forEach(function(a){if(!latest[a.fas]||a.trk>latest[a.fas].trk)latest[a.fas]=a;});
  var arr=Object.values(latest).sort(function(a,b){return b.pct-a.pct;});
  var h='<div class="card"><div class="ch"><span class="ct">Ringkasan Audit Dokumentasi</span><span class="cs">'+arr.length+' fasiliti</span></div><div style="padding:12px 16px">';
  arr.forEach(function(a){
    var did='fd2_'+fdk(a.fas);
    var det='<div id="'+did+'" class="fd" style="display:none">';
    det+=fdInfo([['Tarikh',a.trk],['Evaluator',a.ev||'—'],['Jawatan',a.jw||'—'],['Markah',a.tot+'/'+a.max+' ('+a.pct+'%)']]);
    det+=fdWeak(a.wk,'Score');det+=fdItems(a.items,['Item','Score','Remarks']);
    det+='</div>';h+=fasBar(a,did,'fas')+det;
  });
  h+='</div></div>';el.innerHTML=h;
}
function rdD3(){
  dch();var el=document.getElementById('dash-d3');
  if(!H3.length){el.innerHTML='<div class="card"><div class="es">Tiada rekod audit personel lagi.</div></div>';return;}
  var byFas={};H3.forEach(function(a){if(!byFas[a.fas])byFas[a.fas]=[];byFas[a.fas].push(a);});
  var h='<div class="card"><div class="ch"><span class="ct">Ringkasan Audit Personel</span><span class="cs">'+H3.length+' rekod</span></div><div style="padding:12px 16px">';
  Object.entries(byFas).forEach(function(e){
    var fas=e[0],aud=e[1];
    var avg=Math.round(aud.reduce(function(s,a){return s+a.pct;},0)/aud.length);
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 11px;background:var(--sur);border:1px solid var(--bor);border-radius:6px"><span style="flex:1;font-size:13px;font-weight:600">'+fas+'</span><span style="font-size:11px;color:var(--tx2)">'+aud.length+' staf</span><span style="font-family:var(--mo);font-size:12px;margin-left:8px">'+avg+'% avg</span><span class="rtag '+rC(avg)+'">'+rL(avg)+'</span></div>';
    aud.sort(function(a,b){return b.pct-a.pct;}).forEach(function(a){
      var did='fd3_'+fdk(fas+a.pyd+a.trk);
      var det='<div id="'+did+'" class="fd" style="display:none">';
      det+=fdInfo([['PYD',a.pyd],['Penyelia',a.pen],['Tarikh',a.trk],['Markah',a.tot+'/'+a.max+' ('+a.pct+'%)']]);
      det+=fdSec(a.sD)+fdWeak(a.wk,'Markah')+fdItems(a.items,['Item','Markah','Catatan']);
      if(a.ul)det+='<div style="margin-top:8px"><div class="fd-lbl">Ulasan Penyelia</div><div style="font-size:11px;font-style:italic">"'+a.ul+'"</div></div>';
      det+='</div>';h+=fasBar(a,did,'pyd')+det;
    });
    h+='<div style="height:8px"></div>';
  });
  h+='</div></div>';el.innerHTML=h;
}
function rHist(n){
  var hist=n===1?H1:n===2?H2:H3;
  var el=document.getElementById('hist-h'+n);
  if(!hist.length){el.innerHTML='<div class="card"><div class="es">Tiada rekod audit lagi.</div></div>';return;}
  var cols=n===3?['Nama PYD','Unit/Fasiliti','Penyelia','Tarikh','Markah','Rating']:['Fasiliti','Tarikh',n===2?'Evaluator':'Auditor','Markah','Rating'];
  var h='<div class="card"><table class="htbl"><thead><tr>'+cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
  [...hist].reverse().forEach(function(a){
    var r=rC(a.pct);
    var row=n===3?'<td>'+a.pyd+'</td><td>'+(a.fas||'—')+'</td><td>'+a.pen+'</td><td>'+a.trk+'</td>':n===2?'<td>'+a.fas+'</td><td>'+a.trk+'</td><td>'+(a.ev||'—')+'</td>':'<td>'+a.fas+'</td><td>'+a.trk+'</td><td>'+(a.aud||'—')+'</td>';
    h+='<tr>'+row+'<td style="font-family:var(--mo)">'+a.pct+'% <span style="font-size:10px;color:var(--tx3)">('+a.tot+'/'+a.max+')</span></td><td><span class="rtag '+r+'">'+a.pct+'%</span></td></tr>';
  });
  h+='</tbody></table></div>';el.innerHTML=h;
}
function sp(p){
  document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('on');});
  document.getElementById('pg-'+p).classList.add('on');
  var pgs=['b1','b2','b3','dash','pan','hist'];
  document.querySelectorAll('.nb')[pgs.indexOf(p)].classList.add('on');
  if(p==='dash'){rdD1();rdD2();rdD3();}
  if(p==='hist'){rHist(1);rHist(2);rHist(3);}
}
function sdash(d,btn){
  dch();
  ['d1','d2','d3'].forEach(function(x){document.getElementById('dash-'+x).style.display=x===d?'block':'none';});
  if(d==='d1')rdD1();if(d==='d2')rdD2();if(d==='d3')rdD3();
  document.querySelectorAll('#pg-dash .stb').forEach(function(b,i){b.classList.toggle('on',['d1','d2','d3'][i]===d);});
}
function spx(p,btn){
  ['p1','p2'].forEach(function(x){document.getElementById('pan-'+x).style.display=x===p?'block':'none';});
  document.querySelectorAll('#pg-pan .stb').forEach(function(b,i){b.classList.toggle('on',['p1','p2'][i]===p);});
}
function shx(h,btn){
  ['h1','h2','h3'].forEach(function(x){document.getElementById('hist-'+x).style.display=x===h?'block':'none';});
  if(btn)document.querySelectorAll('#pg-hist .stb').forEach(function(b,i){b.classList.toggle('on',['h1','h2','h3'][i]===h);});
}
var today=new Date().toISOString().slice(0,10);
['b1-d','b2-d','b3-d'].forEach(function(id){document.getElementById(id).value=today;});
bldB1();bldB2();bldB3();bldPan();

</script>
